<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yonis Diriye — AI automation and full-stack developer</title>
  <desc id="desc">A minimal animated systems diagram connecting workflow, intelligence, and product.</desc>
  <defs>
    <linearGradient id="signal" x1="134" y1="228" x2="1066" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B3A38"/>
      <stop offset="0.48" stop-color="#8B3734"/>
      <stop offset="1" stop-color="#FF6961"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(954 76) rotate(141.8) scale(278 179)">
      <stop stop-color="#682C2A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#111110" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <path id="route" d="M134 228C285 228 330 186 463 186C596 186 626 228 756 228C886 228 913 180 1066 180"/>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#111110"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" stroke="#2B2A28" stroke-width="2"/>

  <g opacity="0.32" stroke="#343330">
    <path d="M72 72H1128"/>
    <path d="M72 248H1128"/>
    <path d="M72 72V248"/>
    <path d="M1128 72V248"/>
  </g>

  <text x="88" y="131" fill="#F4F1EA" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="650" letter-spacing="-1.5">YONIS DIRIYE</text>
  <text x="91" y="167" fill="#A7A39C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="500" letter-spacing="3">AI AUTOMATION  /  FULL-STACK</text>

  <path d="M134 228C285 228 330 186 463 186C596 186 626 228 756 228C886 228 913 180 1066 180" stroke="#302F2D" stroke-width="2"/>
  <path d="M134 228C285 228 330 186 463 186C596 186 626 228 756 228C886 228 913 180 1066 180" stroke="url(#signal)" stroke-width="2" stroke-dasharray="1 18" stroke-linecap="round"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1.6">
    <circle cx="134" cy="228" r="5" fill="#696661"/>
    <text x="110" y="271" fill="#85817B">WORKFLOW</text>
    <circle cx="600" cy="209" r="5" fill="#9C403C"/>
    <text x="560" y="271" fill="#85817B">INTELLIGENCE</text>
    <circle cx="1066" cy="180" r="5" fill="#FF6961"/>
    <text x="1038" y="271" fill="#85817B">PRODUCT</text>
  </g>

  <circle r="13" fill="#FF6961" opacity="0.18" filter="url(#softGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#FF6961">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </circle>
</svg>
